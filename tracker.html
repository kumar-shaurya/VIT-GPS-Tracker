<!DOCTYPE html>
<html>
<head>
    <title>VIT Chennai Live GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; text-align: center; }
        .header { background: #003366; color: white; padding: 15px; margin-bottom: 20px; }
        #map { height: 500px; width: 90%; margin: 0 auto; border-radius: 15px; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .stats { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .box { background: white; padding: 15px; border-radius: 10px; min-width: 120px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .val { font-size: 1.4em; font-weight: bold; color: #003366; display: block; }
        .lbl { font-size: 0.8em; color: #777; }
    </style>
</head>
<body>

    <div class="header"><h1>VIT Chennai Live Tracker</h1></div>
    <div id="map"></div>

    <div class="stats">
        <div class="box"><span class="lbl">Satellites</span><span id="sats" class="val">--</span></div>
        <div class="box"><span class="lbl">Latitude</span><span id="lat" class="val">--</span></div>
        <div class="box"><span class="lbl">Longitude</span><span id="lng" class="val">--</span></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcx6Cmwsrk1FWHf4Dzz1-yAfLR8jD13RY",
            authDomain: "vit-gps-tracker.firebaseapp.com",
            databaseURL: "https://vit-gps-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vit-gps-tracker",
            storageBucket: "vit-gps-tracker.firebasestorage.app",
            messagingSenderId: "536385712825",
            appId: "1:536385712825:web:07512a22925f21b91e2168"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('gps');

        // Set map to VIT Chennai Academic Blocks
        var map = L.map('map').setView([12.8442, 80.1517], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var marker = L.marker([12.8442, 80.1517]).addTo(map).bindPopup("Current Location").openPopup();

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('lat').innerText = data.lat.toFixed(6);
                document.getElementById('lng').innerText = data.lng.toFixed(6);
                document.getElementById('sats').innerText = data.sats;

                const newPos = [data.lat, data.lng];
                marker.setLatLng(newPos);
                map.panTo(newPos);
            }
        });
    </script>
</body>
</html>
