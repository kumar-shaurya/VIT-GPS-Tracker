<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL | GPS Command Center</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --danger: #ff4444;
            --bg: #0a0a0c;
            --card: #16161a;
            --border: #2a2a30;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Fix */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            z-index: 2000;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--primary);
            font-size: 1rem;
        }

        /* Map Fix */
        #map {
            flex: 1;
            width: 100%;
            background: #000;
            z-index: 1;
        }

        /* Controls Fix - Floating Layer */
        .controls {
            position: absolute;
            bottom: 130px; /* Moved up to avoid dashboard overlap */
            left: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(31, 31, 35, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            z-index: 1000;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .control-group { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        
        input[type=range] { 
            cursor: pointer; 
            accent-color: var(--primary); 
            width: 70px; 
        }

        button {
            background: var(--primary);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            color: black;
        }

        .btn-alt { background: #333; color: white; }
        .btn-off { background: var(--danger); color: white; }
        .btn-deactivate { background: #2a1414; color: #ff4444; border: 1px solid #ff4444; }

        /* Dashboard Fix */
        .dashboard {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px;
            background: var(--card);
            border-top: 1px solid var(--border);
            z-index: 2000;
        }

        .stat-card {
            background: #1c1c21;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .label {
            color: #666;
            font-size: 0.55rem;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
        }

        .value {
            display: block;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
            white-space: nowrap;
        }

        /* Mobile specific fixes */
        @media (max-width: 600px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); }
            .controls { bottom: 145px; } /* Push controls higher on tiny screens */
            .brand span { display: none; }
        }

        .status-online { color: var(--primary); }
        .status-danger { color: var(--danger); animation: pulse 1.5s infinite; }
        .alert-bg { border-color: var(--danger) !important; background: #2a1414 !important; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">SENTINEL<span>.GPS</span></div>
        <div class="control-group">
            <div id="heartbeat" style="height:8px; width:8px; border-radius:50%; background:#333;"></div>
            <span id="status-text" class="label" style="font-size: 0.5rem;">OFFLINE</span>
        </div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <div class="control-group">
            <span class="label">RAD</span>
            <input type="range" id="radius-slider" min="10" max="1000" value="150">
            <span id="radius-display" style="color:var(--primary); font-family: monospace; font-size: 0.75rem;">150m</span>
        </div>
        <button id="fence-toggle-btn">Activate</button>
        <button id="toggle-path-btn">Path: ON</button>
        <button id="clear-path-btn" class="btn-alt">Clear</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <span class="label">Position</span>
            <span id="val-coords" class="value">0,0</span>
        </div>
        <div class="stat-card" id="fence-card">
            <span class="label">Fence</span>
            <span id="val-fence" class="value" style="color:#444">IDLE</span>
        </div>
        <div class="stat-card">
            <span class="label">Sats</span>
            <span id="val-sats" class="value">00</span>
        </div>
        <div class="stat-card">
            <span class="label">Sync</span>
            <span id="val-time" class="value">--:--</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcx6Cmwsrk1FWHf4Dzz1-yAfLR8jD13RY",
            databaseURL: "https://vit-gps-tracker-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('gps');

        let fenceCenter = null; 
        let fenceRadius = 150;
        let pathActive = true;
        let firstLock = true;
        let fenceIsOn = false;
        
        const alertAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        var map = L.map('map', { zoomControl: false }).setView([12.8442, 80.1517], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // --- NULL CHECK FIX ---
        // Initialize geofence IMMEDIATELY but invisible
        var geofence = L.circle([0, 0], {
            color: '#00ff88', fillColor: '#00ff88', fillOpacity: 0.1,
            radius: fenceRadius, weight: 2, opacity: 0
        }).addTo(map);

        var marker = L.marker([0, 0], { opacity: 0 }).addTo(map);
        var breadcrumbs = L.polyline([], { color: '#00ff88', weight: 2, opacity: 0.6 }).addTo(map);

        function setFence(latlng) {
            if(!geofence) return; // Error Prevention
            fenceCenter = latlng;
            geofence.setLatLng(fenceCenter);
            geofence.setStyle({ opacity: 1 });
            fenceIsOn = true;
            const btn = document.getElementById('fence-toggle-btn');
            btn.innerText = "Deactivate";
            btn.classList.add('btn-deactivate');
            updateFenceStatus();
        }

        function disableFence() {
            fenceIsOn = false;
            fenceCenter = null;
            if(geofence) geofence.setStyle({ opacity: 0 });
            const btn = document.getElementById('fence-toggle-btn');
            btn.innerText = "Activate";
            btn.classList.remove('btn-deactivate');
            document.getElementById('val-fence').innerText = "IDLE";
            document.getElementById('val-fence').style.color = "#444";
            document.getElementById('fence-card').classList.remove('alert-bg');
        }

        function updateFenceStatus() {
            if (!fenceIsOn || !fenceCenter || !geofence) return;
            const currentPos = marker.getLatLng();
            const distance = map.distance(currentPos, fenceCenter);
            const fenceText = document.getElementById('val-fence');
            const fenceCard = document.getElementById('fence-card');

            if (distance > fenceRadius) {
                fenceText.innerText = "OUT";
                fenceText.className = "value status-danger";
                fenceCard.classList.add('alert-bg');
                geofence.setStyle({ color: '#ff4444', fillColor: '#ff4444' });
                alertAudio.play().catch(e => {});
            } else {
                fenceText.innerText = "IN";
                fenceText.className = "value status-online";
                fenceCard.classList.remove('alert-bg');
                geofence.setStyle({ color: '#00ff88', fillColor: '#00ff88' });
            }
        }

        document.getElementById('fence-toggle-btn').onclick = function() {
            if (fenceIsOn) disableFence();
            else if (marker.options.opacity !== 0) setFence(marker.getLatLng());
        };

        map.on('click', (e) => setFence(e.latlng));

        document.getElementById('radius-slider').oninput = (e) => {
            fenceRadius = parseInt(e.target.value);
            document.getElementById('radius-display').innerText = fenceRadius + "m";
            if(geofence) geofence.setRadius(fenceRadius);
            if(fenceIsOn) updateFenceStatus();
        };

        document.getElementById('toggle-path-btn').onclick = function() {
            pathActive = !pathActive;
            this.innerText = pathActive ? "Path: ON" : "Path: OFF";
            this.className = pathActive ? "" : "btn-off";
        };

        document.getElementById('clear-path-btn').onclick = () => breadcrumbs.setLatLngs([]);

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            const pos = [data.lat, data.lng];
            if (firstLock) {
                map.setView(pos, 17);
                marker.setOpacity(1);
                firstLock = false;
            }
            document.getElementById('val-coords').innerText = `${data.lat.toFixed(3)},${data.lng.toFixed(3)}`;
            document.getElementById('val-sats').innerText = data.sats;
            document.getElementById('val-time').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('heartbeat').style.background = '#00ff88';
            document.getElementById('status-text').innerText = "LIVE";
            marker.setLatLng(pos);
            if (pathActive) breadcrumbs.addLatLng(pos);
            if(fenceIsOn) updateFenceStatus();
        });
        
        setTimeout(() => { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
